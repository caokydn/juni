/*

*/

const MIN_EXERCISE = 1;

/* =====================================================
   PARSE REPOSITORY NAME
===================================================== */


/*
    QUY TẮC MỚI:

    REPO = BOOK CODE + UNIT + EXERCISE


    Ví dụ:

    funstarter124

    ├── funstarter = BOOK
    ├── 12          = UNIT
    └── 4           = EXERCISE


    Ví dụ:

    funstarter91

    ├── funstarter
    ├── 9
    └── 1


    Ví dụ:

    funstarter301

    ├── funstarter
    ├── 30
    └── 1


    Ví dụ:

    funstarter10a1

    ├── funstarter
    ├── 10a
    └── 1


    Ví dụ:

    funstarter10b2

    ├── funstarter
    ├── 10b
    └── 2


    QUAN TRỌNG:

    - Không giới hạn Unit.
    - Không cần biết Unit có 9, 15, 30 hay 50.
    - Exercise luôn là ký tự cuối.
*/


function parseRepo(
    repoName,
    bookCode
){

    /*
        Kiểm tra tên repo có bắt đầu
        chính xác bằng bookCode không.
    */

    if(
        !repoName
            .toLowerCase()
            .startsWith(
                bookCode.toLowerCase()
            )
    ){

        return null;

    }


    /*
        Cắt tên sách ở đầu.
    */

    const middle =
        repoName.slice(
            bookCode.length
        );


    /*
        Phải còn ít nhất 2 ký tự:

        Unit + Exercise
    */

    if(middle.length < 2){

        return null;

    }


    /*
        Ký tự cuối cùng
        luôn là Exercise.
    */

    const lastChar =
        middle.slice(-1);


    /*
        Chỉ nhận Exercise 1-6.
    */

    if(
        !/^[1-6]$/.test(
            lastChar
        )
    ){

        return null;

    }


    const exercise =
        parseInt(
            lastChar,
            10
        );


    /*
        Phần ở giữa
        chính là Unit.
    */

    const unit =
        middle.slice(
            0,
            -1
        );


    /*
        Unit không được rỗng.
    */

    if(!unit){

        return null;

    }


    /*
        Unit phải bắt đầu bằng số.

        Cho phép:

        1
        9
        15
        30
        50
        10a
        10b
        25a
        ...
    */

    if(
        !/^\d+[a-z]*$/i.test(
            unit
        )
    ){

        return null;

    }


    /*
        Lấy phần số của Unit
        để sắp xếp.

        Ví dụ:

        10a → 10
        10b → 10
        30  → 30
    */

    const numberMatch =
        unit.match(
            /^\d+/
        );


    const unitNumber =
        numberMatch
            ? parseInt(
                numberMatch[0],
                10
            )
            : 0;


    return {

        repo:repoName,

        unit:unit,

        unitNumber:unitNumber,

        exercise:exercise

    };

}


/* =====================================================
   SORT UNITS
===================================================== */


/*
    Ví dụ:

    1
    2
    9
    10
    10a
    10b
    11
    30
    50
*/


function sortUnits(a,b){

    /*
        Trước tiên so sánh số.
    */

    if(
        a.unitNumber !==
        b.unitNumber
    ){

        return (
            a.unitNumber -
            b.unitNumber
        );

    }


    /*
        Nếu cùng số:

        10
        10a
        10b

        Unit không có chữ
        sẽ đứng trước.
    */

    return a.unit.localeCompare(
        b.unit,
        undefined,
        {
            numeric:true,
            sensitivity:"base"
        }
    );

}

function showBook(book){

        "",
        "#book-" + book.code
    );

        "subtitle"
    ).innerText =

        document.getElementById(

        document.createElement(
            "button"
        );

        "back-btn";

        document.createElement(
            "div"

};


content.appendChild(

    /* =================================================

    const parsedRepos = [];


    allRepos.forEach(repo => {


        if(
            !repo ||
            !repo.name
        ){

            return;

        }


        const parsed =
            parseRepo(

            );


        if(parsed){

            parsedRepos.push(

    /* =================================================

            10
            10a

        */

            item.unit.toLowerCase();

                    item.unit,

                unitNumber:

        }

        */

            .exercises[
                item.exercise

row.appendChild(

/* =====================================================
   LOAD
===================================================== */

async function load(){

    const content =
        document.getElementById(
            "content"
        );


    try{

        /*
            Đọc danh sách repository
            từ games.json

            Không gọi GitHub API.
        */

        const response =
            await fetch(
                "games.json?t=" +
                Date.now()
            );


        if(!response.ok){

            throw new Error(
                "Cannot load games.json"
            );

        }


        const data =
            await response.json();


/*
    games.json mới có dạng:

    {
        "1ff01": {
            "vocab": [...]
        },

        "1ff02": {
            "vocab": []
        }
    }
*/


gamesData = data;


/*
    Chuyển games.json thành
    danh sách repository để
    phần code hiện tại tiếp tục dùng.
*/

allRepos =
    Object.keys(
        gamesData
    ).map(
        name => ({
            name:name,
            private:false
        })
    );


        /*
            Hiển thị danh sách sách.
        */

        showBooks();

    }
    catch(error){

        console.error(error);


        content.innerHTML = `

            <div class="error">

                Không thể tải danh sách game.

                <br><br>

                Please try again later.

            </div>

        `;

    }

}
